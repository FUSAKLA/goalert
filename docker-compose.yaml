version: '3.8'

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Prague # Change this to your timezone
    ports:
      - 80:80 # HTTP entryPoints
      - 443:443 # HTTPS entryPoints
    configs:
      - source: traefik_config
        target: /traefik.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket to watch for Traefik
      - traefik-certs:/certs # Docker volume to store the acme file for the Certifactes

  postgres:
    image: postgres:15-alpine
    container_name: goalert-postgres
    environment:
      POSTGRES_DB: goalert
      POSTGRES_USER: goalert
      POSTGRES_PASSWORD: goalert
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goalert']
      interval: 5s
      timeout: 5s
      retries: 5

  goalert:
    image: goalert:szn
    container_name: goalert
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.goalert.rule=Host(`goalert.fusakla.cz`)'
      - 'traefik.http.routers.goalert.entrypoints=websecure'
      - 'traefik.http.routers.goalert.tls=true'
      - 'traefik.http.routers.goalert.tls.certresolver=letencrypt'
      - 'traefik.http.services.goalert.loadbalancer.server.port=8081'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOALERT_DB_URL: postgres://goalert:goalert@postgres:5432/goalert?sslmode=disable
      GOALERT_DATA_ENCRYPTION_KEY: super-awesome-secret-key-change-me
      GOALERT_LISTEN: :8081
    ports:
      - '8081:8081'
      - '2112:2112' # Prometheus metrics
    volumes:
      - ./:/app

  prometheus:
    image: prom/prometheus:latest
    container_name: goalert-prometheus
    ports:
      - '9090:9090'
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  postgres_data:
  prometheus_data:
  traefik-certs:
    name: traefik-certs

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: 'goalert'
          static_configs:
            - targets: ['goalert:2112']

  traefik_config:
    content: |
      api:
        dashboard: false # Optional can be disabled
        insecure: false # Optional can be disabled
        debug: false # Optional can be Enabled if needed for troubleshooting
      entryPoints:
        web:
          address: ":80"
        # Optional if you want to redirect all HTTP to HTTPS
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
        websecure:
          address: ":443"
      serversTransport:
        insecureSkipVerify: false
      providers:
        docker:
          endpoint: "unix:///var/run/docker.sock"
          exposedByDefault: false
      certificatesResolvers:
        letencrypt:
          acme:
            email: goalert@fusakla.cz
            storage: /certs/acme.json
            # caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
            caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging
            httpChallenge:
              entryPoint: web
